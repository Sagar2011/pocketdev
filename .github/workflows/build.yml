name: Build desktop
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Build one platform (unsigned test artifact)
        required: true
        type: choice
        options: [macos-latest, windows-latest, ubuntu-latest]
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ inputs.platform }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: pocketdev-${{ inputs.platform }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error
