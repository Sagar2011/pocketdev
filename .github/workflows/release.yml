name: Release PocketDev

on:
  workflow_dispatch:
    inputs:
      action:
        description: Build a platform draft, or publish a tested draft to your marketplace users
        required: true
        type: choice
        default: build
        options: [build, publish]
      tag:
        description: 'Publish only: existing draft tag, e.g. v1.1.0 (resolve release blockers first)'
        required: false
        type: string
      platform:
        description: Build one unsigned beta platform
        required: true
        type: choice
        default: macos-15
        options: [macos-15, macos-15-intel, windows-2022, ubuntu-24.04]

permissions:
  contents: read

concurrency:
  group: pocketdev-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.action == 'build'
    runs-on: ${{ inputs.platform }}
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate release versions
        id: version
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const pkg = require('./package.json');
          const plugin = require('./plugin/.claude-plugin/plugin.json');
          const market = require('./.claude-plugin/marketplace.json');
          const lock = require('./package-lock.json');
          assert.match(pkg.version, /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/);
          assert.equal(plugin.version, pkg.version, 'Plugin version must match the app');
          assert.equal(market.plugins.find(p => p.name === plugin.name)?.version, pkg.version, 'Marketplace version must match');
          assert.equal(lock.version, pkg.version, 'Refresh package-lock.json');
          assert.equal(lock.packages[''].version, pkg.version);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${pkg.version}\n`);
          NODE
      - run: npm ci
      - run: npm test
      - name: Desktop smoke test (macOS)
        if: runner.os == 'macOS'
        run: npm run test:desktop
      - run: npm run dist
      - name: Write release checksums
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { createHash } = require('node:crypto');
          const files = fs.readdirSync('dist').filter(name => /^PocketDev-.*\.(zip|AppImage)$/.test(name));
          if (!files.length) throw new Error('No companion archives produced');
          for (const file of files) {
            const hash = createHash('sha256').update(fs.readFileSync(`dist/${file}`)).digest('hex');
            fs.writeFileSync(`dist/${file}.sha256`, `${hash}\n`);
          }
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.AppImage
            dist/*.sha256

  draft:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # This job never checks out or executes repository/dependency code.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: assets
      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          # Listing succeeds or fails explicitly: API errors are never mistaken for a missing release.
          gh api --paginate "repos/$GH_REPO/releases" --jq '.[]' > releases.json
          existing=$(jq -s --arg tag "$TAG" '[.[] | select(.tag_name == $tag)][0] // empty' releases.json)
          if [[ -n "$existing" ]]; then
            [[ $(jq -r '.draft' <<< "$existing") == true ]] || { echo 'Refusing to overwrite a published release.'; exit 1; }
            [[ $(jq -r '.target_commitish' <<< "$existing") == "$SOURCE_SHA" ]] || { echo 'Draft was built from another commit. Use a new version or remove the old draft first.'; exit 1; }
          fi
          # An existing tag must also point to this exact source commit.
          gh api --paginate "repos/$GH_REPO/tags?per_page=100" --jq '.[]' > tags.json
          tagged_sha=$(jq -sr --arg tag "$TAG" '[.[] | select(.name == $tag)][0].commit.sha // empty' tags.json)
          [[ -z "$tagged_sha" || "$tagged_sha" == "$SOURCE_SHA" ]] || { echo 'Release tag points to another commit.'; exit 1; }
          shopt -s nullglob
          files=(assets/*.zip assets/*.AppImage)
          (( ${#files[@]} > 0 )) || { echo 'No release assets found.'; exit 1; }
          for file in "${files[@]}"; do
            [[ -f "$file.sha256" ]] || { echo 'Missing release checksum.'; exit 1; }
            expected=$(cat "$file.sha256")
            actual=$(sha256sum "$file" | cut -d ' ' -f 1)
            [[ "$expected" == "$actual" ]] || { echo 'Release checksum mismatch.'; exit 1; }
          done
          files+=(assets/*.sha256)
          if [[ -z "$existing" ]]; then
            cat > notes.md <<NOTES
          PocketDev by Sagar — unsigned public beta.

          Install the plugin below, then start a new local Claude Code session. PocketDev downloads the matching app, verifies its checksum, and launches the avatar automatically. No manual ZIP download or npm command is needed. Node.js 22+ on PATH and a graphical desktop are required.

          Inside Claude Code:
          \`\`\`text
          /plugin marketplace add $GH_REPO
          /plugin install pocketdev@pocketdev-local
          \`\`\`
          The first download may take a few minutes. Later sessions use the cached app. Only platforms with an attached archive and checksum are available. Regular Claude Chat, SSH, and cloud sessions are not supported. Use /pocketdev:help for startup status and disable/uninstall instructions.

          These builds are unsigned and not notarized. Review and manually test each platform before publishing. Photo customization is optional and uses separately billed OpenAI API calls.

          Built from commit $SOURCE_SHA.
          NOTES
            gh release create "$TAG" --draft --prerelease --target "$SOURCE_SHA" --title "PocketDev $VERSION — Public Beta" --notes-file notes.md
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
          url=$(gh release view "$TAG" --json url --jq .url)
          printf 'Draft release: %s\n\nReview the downloads, then run this workflow with action=publish and the draft tag.\n' "$url" >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: github.ref == 'refs/heads/main' && inputs.action == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # No checkout, npm install, or repository scripts with a write-enabled token.
      - name: Validate and publish existing beta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo 'Enter an existing version tag, e.g. v1.1.0.'; exit 1; }
          version="${TAG#v}"
          gh api --paginate "repos/$GH_REPO/releases" --jq '.[]' > releases.json
          release=$(jq -s --arg tag "$TAG" '[.[] | select(.tag_name == $tag)][0] // empty' releases.json)
          [[ -n "$release" ]] || { echo 'Build the draft first.'; exit 1; }
          [[ $(jq -r '.draft' <<< "$release") == true ]] || { echo 'Release is already public; refusing to change it.'; exit 1; }
          [[ $(jq -r '.target_commitish' <<< "$release") == "$SOURCE_SHA" ]] || { echo 'Draft does not match this main commit. Build a new version from current main.'; exit 1; }
          gh api --paginate "repos/$GH_REPO/tags?per_page=100" --jq '.[]' > tags.json
          tagged_sha=$(jq -sr --arg tag "$TAG" '[.[] | select(.name == $tag)][0].commit.sha // empty' tags.json)
          [[ -z "$tagged_sha" || "$tagged_sha" == "$SOURCE_SHA" ]] || { echo 'Tag points to a different commit.'; exit 1; }
          # Read manifests as data from the exact commit; never evaluate their contents.
          for file in package.json plugin/.claude-plugin/plugin.json .claude-plugin/marketplace.json; do
            gh api "repos/$GH_REPO/contents/$file?ref=$SOURCE_SHA" --jq .content | base64 --decode > "$(basename "$file")"
          done
          jq -e --arg version "$version" '.version == $version' package.json >/dev/null
          jq -e --arg version "$version" '.version == $version and .name == "pocketdev"' plugin.json >/dev/null
          jq -e --arg version "$version" '.name == "pocketdev-local" and any(.plugins[]; .name == "pocketdev" and .version == $version and .source == "./plugin")' marketplace.json >/dev/null
          # Require at least one exact supported archive plus its checksum. Other platforms
          # can be omitted deliberately, but unexpected or unpaired assets fail publication.
          names=()
          while IFS= read -r name; do names+=("$name"); done < <(jq -r '.assets[].name' <<< "$release")
          (( ${#names[@]} > 0 )) || { echo 'Draft has no assets.'; exit 1; }
          count=0
          for name in "${names[@]}"; do
            archive="${name%.sha256}"
            case "$archive" in
              "PocketDev-$version-mac-arm64.zip"|"PocketDev-$version-mac-x64.zip"|"PocketDev-$version-win-x64.zip"|"PocketDev-$version-linux-x64.AppImage") ;;
              *) echo "Unexpected release asset: $name"; exit 1 ;;
            esac
            jq -e --arg name "$archive" 'any(.assets[]; .name == $name)' <<< "$release" >/dev/null
            jq -e --arg name "$archive.sha256" 'any(.assets[]; .name == $name)' <<< "$release" >/dev/null
            if [[ "$name" == "$archive" ]]; then
              mkdir -p assets
              gh release download "$TAG" --pattern "$archive" --pattern "$archive.sha256" --dir assets
              expected=$(cat "assets/$archive.sha256")
              [[ "$expected" =~ ^[a-f0-9]{64}$ ]] || { echo 'Invalid checksum.'; exit 1; }
              actual=$(sha256sum "assets/$archive" | cut -d ' ' -f 1)
              [[ "$expected" == "$actual" ]] || { echo 'Release checksum mismatch.'; exit 1; }
              count=$((count + 1))
            fi
          done
          (( count > 0 )) || { echo 'No platform archives verified.'; exit 1; }
          gh release edit "$TAG" --draft=false --prerelease --latest=false
          url=$(gh release view "$TAG" --json url --jq .url)
          {
            printf 'Published beta: %s\n\nVerified %s platform archive(s).\n\n' "$url" "$count"
            printf 'Your GitHub repository is the marketplace. No separate registry upload or Anthropic token is required.\n\n'
            printf 'Install in Claude Code:\n```text\n/plugin marketplace add %s\n/plugin install pocketdev@pocketdev-local\n```\n' "$GH_REPO"
            printf '\nStart a new local Claude Code session. This does not submit to Anthropic’s directory or official marketplace.\n'
          } >> "$GITHUB_STEP_SUMMARY"
